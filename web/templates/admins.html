{% extends "base.html" %}
{% block title %}Admins{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">👤 Admins</h1>

{% if is_super %}
<div class="bg-white p-4 rounded shadow mb-4">
    <h2 class="font-bold mb-3">➕ Add Admin</h2>
    <form method="post" action="/admins/add" class="grid grid-cols-2 gap-2">
        <input type="text" name="username" placeholder="Username" required class="p-2 border rounded">
        <input type="text" name="phone" placeholder="Phone" required class="p-2 border rounded">
        <input type="password" name="password" placeholder="Password" required class="p-2 border rounded">
        <select name="role" class="p-2 border rounded">
            <option value="admin">Admin</option>
            <option value="superadmin">Superadmin</option>
        </select>
        <button class="bg-blue-600 text-white p-2 rounded col-span-2">Add</button>
    </form>
</div>
{% endif %}

<div class="bg-white p-4 rounded shadow">
    {% for a in admins %}
    <div class="flex justify-between items-center py-2 border-b">
        <div>
            <div class="font-bold">{{ a[1] }} ({{ a[3] }})</div>
            <div class="text-sm text-gray-600">{{ a[2] }}</div>
        </div>
        {% if is_super and a[3] != 'superadmin' %}
        <form method="post" action="/admins/{{ a[0] }}/delete">
            <button class="bg-red-600 text-white px-3 py-1 rounded text-sm">Delete</button>
        </form>
        {% endif %}
    </div>
    {% endfor %}
</div>
{% endblock %}
