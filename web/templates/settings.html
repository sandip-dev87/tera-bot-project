{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">⚙️ Settings</h1>

<form method="post" action="/settings" class="bg-white p-6 rounded shadow space-y-3">
    {% for key, value in settings.items() %}
    <div>
        <label class="block text-sm text-gray-600">{{ key }}</label>
        <input type="text" name="{{ key }}" value="{{ value }}" class="w-full p-2 border rounded">
    </div>
    {% endfor %}
    <button class="bg-blue-600 text-white px-6 py-2 rounded">Save All</button>
</form>
{% endblock %}
